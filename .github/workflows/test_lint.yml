name: Test and lint
on:
  push:
  pull_request:
    branches: [ devel ]
  schedule:
    - cron:  '0 2 * * 6'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Keep in sync with the Python Trove classifiers in pyproject.toml.
        python_version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
    name: Test with Python (${{ matrix.python_version }})

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python_version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python_version }}
        allow-prereleases: true

    - name: Install package
      run: |
        python -m pip install --upgrade --only-binary=:all: "build==1.2.2"
        python -m build --wheel
        python -m pip install --only-binary=:all: dist/*.whl "pytest==8.3.5" "pytest-cov==5.0.0" "html5lib==1.1"

    - name: Run tests
      run: python3 -m pytest

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@e28ff129e5465c2c0dcc6f003fc735cb6ae0c673 # v4.5.0
      with:
         token: ${{ secrets.CODECOV_TOKEN }}
         flags: unittests

  lint:
    runs-on: ubuntu-latest
    name: Lint

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install linters
        run: python3 -m pip install --only-binary=:all: "pylint==3.2.7" "pylint-exit==1.2.0" "pycodestyle==2.12.1"

      - name: Lint with pylint
        run: |
          pylint --rcfile=".github/pylintrc" dkb_robo/ || pylint-exit $?

      - name: Lint with pycodestyle
        run: |
          pycodestyle --max-line-length=380 dkb_robo/.
